name: hasan-journal-selfhost

# Fully self-contained production deployment on a single machine.
#
# Unlike compose.production.yaml (which expects an external S3 provider
# and SMTP relay), this file bundles everything: the app in production
# mode, PostgreSQL, Garage for media and Mailpit for mail capture. It is
# meant for running the real site locally without any external account.
#
# Only the app and the Mailpit inbox are published, and both bind to
# loopback only — nothing here is reachable from the network. Postgres
# and Garage are not published at all.
#
# Configuration comes from .env.selfhost (generated by
# scripts/setup-selfhost.mjs, git-ignored):
#   docker compose -f compose.selfhost.yaml --env-file .env.selfhost up -d
#
# Data lives in this project's own volumes, completely separate from the
# development stack in compose.yaml.

x-app-environment: &app-environment
  NODE_ENV: production
  # Loopback-only deployment: see the ALLOW_LOCAL_PRODUCTION note in
  # src/lib/env.ts. This flag only ever permits loopback hosts.
  ALLOW_LOCAL_PRODUCTION: 'true'
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
  DATABASE_URI: postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_BUCKET: ${GARAGE_BUCKET:?required}
  S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?required}
  S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?required}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@localhost}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Hasan Journal}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    entrypoint: ['/garage']
    command: ['server', '--single-node', '--default-access-key', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?required}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?required}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:?required}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - '3900'
    healthcheck:
      test: ['CMD', '/garage', 'health']
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    ports:
      # Inbox UI — needed to read password-reset links, since there is
      # no external SMTP relay in this setup.
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8025/']
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off migration job. Run before starting or upgrading `app`.
  migrate:
    build:
      context: .
    image: hasan-journal:selfhost
    restart: 'no'
    profiles: ['tools']
    environment: *app-environment
    command: ['node', 'node_modules/payload/bin.js', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  app:
    build:
      context: .
    image: hasan-journal:selfhost
    restart: unless-stopped
    environment: *app-environment
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  mailpit-data:
