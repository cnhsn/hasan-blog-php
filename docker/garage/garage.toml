# Garage (S3-compatible object storage) single-node config for local
# dev/test. No secrets here: GARAGE_RPC_SECRET, GARAGE_DEFAULT_ACCESS_KEY,
# GARAGE_DEFAULT_SECRET_KEY and GARAGE_DEFAULT_BUCKET come from the
# environment at container start (see compose.yaml / .env). See
# docs/DECISIONS.md for why Garage instead of MinIO.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
